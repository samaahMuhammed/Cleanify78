<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Just One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
/* Layout & Theme Variables */
:root {
  --bg: #EAF1EE; --surface: #F7FAF8; --ink: #1C3438; --muted: #587074; --line: #CFDCD8;
  --soft: #D9EAE7; --accent: #2F7E8C; --accent-ink: #FFFFFF; --warm: #E2AE3A; --warm-ink: #3A2A00; --ok: #3C8D62;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1C1E; --surface: #162629; --ink: #E3EFEC; --muted: #8FA9AB; --line: #284045;
    --soft: #1D3539; --accent: #6FC0CB; --accent-ink: #0F1C1E; --warm: #E3B650; --warm-ink: #2A1E00; --ok: #6CC596;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1C1E; --surface: #162629; --ink: #E3EFEC; --muted: #8FA9AB; --line: #284045;
  --soft: #1D3539; --accent: #6FC0CB; --accent-ink: #0F1C1E; --warm: #E3B650; --warm-ink: #2A1E00; --ok: #6CC596;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #EAF1EE; --surface: #F7FAF8; --ink: #1C3438; --muted: #587074; --line: #CFDCD8;
  --soft: #D9EAE7; --accent: #2F7E8C; --accent-ink: #FFFFFF; --warm: #E2AE3A; --warm-ink: #3A2A00; --ok: #3C8D62;
  color-scheme: light;
}
:root { --w: 30rem; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 1rem; line-height: 1.5; padding-inline: 16px; padding-block: 0 3rem; margin: 0;
  transition: background-color 0.3s, color 0.3s;
}
.wrap { max-width: var(--w); margin-inline: auto; display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem; }

/* Header */
header {
  margin-inline: -16px; padding: 1.75rem 16px 1.5rem; background-color: var(--soft);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 56px 28px, 56px 28px; border-bottom: 1px solid var(--line);
  transition: background-color 0.3s, border-color 0.3s;
}
.avatar-mini { position: absolute; top: 0; right: 0; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--surface); background: var(--accent) center / cover no-repeat; color: var(--accent-ink); font: 700 1rem var(--font-display); padding: 0; display: none; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
header .inner { position: relative; max-width: var(--w); margin-inline: auto; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1.05; margin: 0.35rem 0 0.5rem; letter-spacing: -0.02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 34rem; }

/* Landing Page */
.landing { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center; animation: fadeIn 0.8s ease; }
.landing h1 { font-size: 4rem; margin-bottom: 0.2rem; color: var(--accent); }
.landing .tagline { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 3rem; font-weight: 600; }
.landing-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 2rem; width: 100%; max-width: 24rem; display:flex; flex-direction:column; gap: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.04); }

/* Components */
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; background: var(--soft); border-radius: 12px; }
.tab { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; padding-inline: 2px; }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.1rem 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; min-width: 0; transition: background-color 0.3s, border-color 0.3s; }
.card h2 { font-family: var(--font-display); font-weight: 500; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0; }
.big { font-family: var(--font-display); font-weight: 500; font-size: 1.5rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.note { margin: 0; color: var(--muted); font-size: 0.95rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

button { font: inherit; cursor: pointer; }
.btn { min-height: 44px; padding: 0.55rem 1rem; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-weight: 600; transition: background 0.15s; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.quiet { border-color: transparent; color: var(--muted); font-weight: 500; }
.btn.small { padding: 0.4rem 0.7rem; font-size: 0.9rem; }
.btn.large { padding: 0.8rem 1.5rem; font-size: 1.1rem; width: 100%; }
.btn[disabled] { opacity: 0.6; cursor: default; }

.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip { min-height: 44px; padding: 0.4rem 0.9rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* Badges */
.badges-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:0.8rem; margin-top:0.5rem; }
.badge-item { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:1rem 0.5rem; text-align:center; display:flex; flex-direction:column; align-items:center; gap:0.4rem; transition: opacity 0.3s; }
.badge-item.locked { opacity: 0.4; filter: grayscale(100%); }
.badge-icon { font-size: 2.2rem; margin-bottom: 0.2rem; }
.badge-title { font-weight: 600; font-size: 0.85rem; line-height: 1.1; }
.badge-desc { font-size: 0.75rem; color: var(--muted); line-height: 1.2; }

/* Recipe Cards */
.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.8rem; }
.recipe-card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem; cursor: pointer; transition: transform 0.2s, border-color 0.2s; display:flex; flex-direction:column; justify-content:flex-start; }
.recipe-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.recipe-title { font-family: var(--font-display); font-weight: 600; font-size: 1rem; margin-bottom: 0.3rem; line-height:1.2; word-break: break-word; }
.recipe-card.expanded { grid-column: 1 / -1; cursor: default; transform: none; border-color: var(--accent); background: var(--surface); padding: 1.2rem; }

/* Lists & Forms */
form.add { display: flex; flex-wrap: wrap; gap: 0.5rem; }
form.add input[type="text"], form.add textarea, form.add input[type="password"], form.add input[type="number"] { flex: 1 1 10rem; min-width: 0; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0.5rem 0.8rem; font: inherit; }
form.add select { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0.4rem 0.6rem; font: inherit; }
ul.todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.todo li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.5rem; min-height: 48px; border-top: 1px solid var(--line); padding-block: 0.15rem; }
ul.todo li:first-child { border-top: 0; }
ul.todo .main { flex: 1 1 11rem; min-width: 0; display: flex; flex-direction: column; gap: 0.1rem; }
ul.todo label { display: flex; align-items: center; gap: 0.65rem; cursor: pointer; min-height: 44px; }
ul.todo input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
ul.todo li.is-done .t { text-decoration: line-through; color: var(--muted); }
.x { border: 0; background: transparent; color: var(--muted); min-width: 44px; min-height: 44px; font-size: 1.1rem; border-radius: 10px; cursor: pointer; }
.x:hover { background: var(--soft); }
.tag { font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0.05rem 0.5rem; flex: none; }

.done-mark { color: var(--ok); font-weight: 600; margin: 0; }
.timer { font-family: var(--font-mono); font-weight: 500; font-size: 3rem; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; margin: 0; line-height: 1.1; }
.banner { background: var(--warm); color: var(--warm-ink); border-radius: 10px; padding: 0.6rem 0.85rem; margin: 0; font-weight: 500; }
.timing { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 0.8rem; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 0.7rem 0.9rem; }
.timing .what { flex: 1 1 8rem; min-width: 0; overflow-wrap: anywhere; }
.timer-sm { font-family: var(--font-mono); font-size: 1.4rem; font-variant-numeric: tabular-nums; }

/* Leaderboard */
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.8rem; }
.board li { display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-radius: 999px; padding: 0.6rem 1.2rem; margin-bottom: 0.4rem; }
.board li.rank-1 { background: var(--warm); color: var(--warm-ink); border: none; }
.board li.rank-2 { background: var(--accent); color: var(--accent-ink); border: none; }
.board li.rank-3 { background: var(--ok); color: #fff; border: none; }
.board li.rank-other { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.board-av { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; font-family: var(--font-display); }
.rank-other .board-av { background: var(--soft); color: var(--muted); }
.board-who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; justify-content: center; }
.board-nm { font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board-sub { font-size: 0.8rem; opacity: 0.85; }
.board-score { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; font-variant-numeric: tabular-nums; }

.found { display: flex; flex-direction: column; gap: 0.5rem; }
.found .item { border: 1px solid var(--line); border-radius: 10px; padding: 0.6rem 0.75rem; display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
.feature-list { margin: 0; padding-left: 1.2rem; font-size: 0.85rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.35rem; }

input[type="text"], input[type="password"], input[type="number"], textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem 0.8rem; min-height: 44px; min-width: 0; }
textarea { resize: vertical; min-height: 4.5rem; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.small { font-size: 0.85rem; color: var(--muted); margin: 0; }
.sub { font-size: 0.82rem; color: var(--muted); margin: 0; padding-left: 1.8rem; }
.label { font-weight: 600; margin: 0; }
.say { background: var(--soft); border-radius: 10px; padding: 0.7rem 0.85rem; margin: 0; overflow-wrap: anywhere; }
.idea { display: flex; flex-direction: column; gap: 0.25rem; }
.notes { white-space: pre-wrap; margin: 0.3rem 0 0; font-size: 0.92rem; overflow-wrap: anywhere; }
.pts { font-family: var(--font-mono); font-size: 0.8rem; opacity: 0.8; }
.chip.add { border-style: dashed; color: var(--muted); }
.chip.add:hover { background: var(--soft); }
.meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 0.2rem 0; width: 100%; }

/* Recipe rows */
ul.recipes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.recipes > li { border-top: 1px solid var(--line); }
ul.recipes > li:first-child { border-top: 0; }
.recipe-row { width: 100%; display: flex; align-items: center; gap: 0.75rem; min-height: 56px; padding: 0.5rem 0.1rem; background: transparent; border: 0; color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
.recipe-row:hover .rr-name { color: var(--accent); }
.rr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.1rem; }
.rr-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
.rr-sub { font-size: 0.85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-chev { color: var(--muted); font-size: 0.75rem; flex: none; }
.rr-body { padding: 0.1rem 0.1rem 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
ul.ing { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.15rem; overflow-wrap: anywhere; }
form.add.stack { flex-direction: column; flex-wrap: nowrap; gap: 0.5rem; }

/* Adaptive layout */
.shell { display: block; }
.main { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.shell > .tabs { margin-bottom: 1rem; }
body { padding-inline: max(16px, env(safe-area-inset-left), env(safe-area-inset-right)); }

@media (min-width: 1100px) {
  :root { --w: 72rem; }
  .shell { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); gap: 1.75rem; align-items: start; }
  .shell > .tabs { position: sticky; top: 1rem; margin: 0; display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 16px; }
  .shell > .tabs .tab { text-align: left; padding: 0.6rem 1rem; min-height: 46px; font-size: 0.95rem; }
}
</style>
</head>
<body>

<header id="mainHeader" style="display:none;">
  <div class="inner">
    <p class="eyebrow" id="dateLine"></p>
    <h1>Just One</h1>
    <p class="lede" id="quoteLine"></p>
    <button id="profileBtn" class="avatar-mini" data-act="open-profile" aria-label="My profile" title="My profile"></button>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
(function () {
  var DEFAULT_DB = "https://just-one-8f109-default-rtdb.firebaseio.com";
  var KEY = "one-small-thing-v1";
  var SKEY = "one-small-thing-session";
  var TKEY = "one-small-thing-timer";
  var AUTH_KEY = "one-small-thing-auth";

  var QUOTES = [
    "A home that stays clear, one easy job at a time. Skip any of it, nothing breaks.",
    "A clear space makes for a clear mind. Small steps keep the peace.",
    "Your home is a living space, not a storage space. Move slowly, clear gently.",
    "Peace at home doesn't require perfection. Just a little care, every so often."
  ];

  var POOL = [
    "Wipe down the counter by the stove", "Bring one mug back to the kitchen", "Empty the dish rack",
    "Rinse the sink and run hot water for a minute", "Take out the small trash if it is half full",
    "Wipe the microwave handle and buttons", "Wash the one pan on the stove", "Clear just one shelf of clutter"
  ];
  
  var MY_SUGGEST = [
    { text: "Clean your desk", rep: "weekly" }, { text: "Do laundry", rep: "weekly" },
    { text: "Make your bed", rep: "daily" }, { text: "Take your dishes to the kitchen", rep: "daily" }
  ];
  var HOUSE_SUGGEST = [
    { text: "Clear the table", area: "Kitchen" }, { text: "Take out the trash", area: "Entry" },
    { text: "Load the dishwasher", area: "Kitchen" }, { text: "Wipe the bathroom sink", area: "Bathroom" }
  ];
  var SHOP_SUGGEST = ["Dishwasher tablets", "Dish soap", "Bin bags", "Sponges", "Paper towels", "Milk", "Eggs"];
  
  var DIETS = [["none", "No restrictions"], ["halal", "Halal"], ["vegetarian", "Vegetarian"], ["vegan", "Vegan"], ["pescatarian", "Pescatarian"]];
  var DIET_RULES = { "none": "No dietary restrictions.", "halal": "Strictly halal.", "vegetarian": "Vegetarian." };

  var COOK = [
    ["Shakshuka with warm pita", "Eggs poached in spiced tomato sauce", 20, "breakfast veg"],
    ["Masala omelette and toast", "Onion, green chilli and coriander", 10, "breakfast veg"],
    ["Chicken shawarma wraps", "Chicken thighs, garlic yogurt and pickles", 30, "lunch"],
    ["Chicken biryani", "Chicken, basmati and yogurt marinade", 50, "dinner"]
  ];
  var cookKind = "breakfast";
  var cookN = 0;
  var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  function loadJson(k) { try { var r = localStorage.getItem(k); if (r) return JSON.parse(r); } catch (e) {} return null; }
  function saveJson(k, v) { try { if (v) localStorage.setItem(k, JSON.stringify(v)); else localStorage.removeItem(k); } catch (e) {} }

  var currentUser = loadJson(AUTH_KEY);
  var uid = currentUser ? currentUser.uid : (localStorage.getItem("one-small-thing-uid") || "u_" + Math.random().toString(36).substring(2, 8));
  localStorage.setItem("one-small-thing-uid", uid);

  var relay = loadJson("one-small-thing-relay");
  var me = localLoadMe();
  var shared = getArr("one-small-thing-db-shared");
  var shopping = getArr("one-small-thing-db-shopping");
  var chat = getArr("one-small-thing-db-chat");
  var chatReads = loadJson("one-small-thing-db-chatread") || {};
  var houseRecipes = getArr("one-small-thing-db-recipes");
  var scores = loadJson("one-small-thing-db-scores") || {};

  var session = loadJson(SKEY);
  var timer = loadJson(TKEY);
  var tab = "me";
  var boardFilter = "house";
  var showCompletedHouse = false, showStats = false, showChat = false;
  var showCompletedMine = false, showUpcoming = false, showHistory = false, historyAll = false;
  var openRecipeId = "";
  var nudge = { text: "", busy: false };
  var ai = { busy: false, result: null, err: "" };
  var flashMsg = "", pendingRm = "", confirmAct = "", recipeNote = "", tickId = null;

  function blankMe() { return { visits: [], done: {}, skip: {}, swap: {}, last: null, chores: [], timeLog: [], doneLog: [], name: currentUser ? currentUser.name : "", photo: currentUser ? currentUser.photo : "", theme: "auto", kitchenMode: "house", kitchenGroupId: "", diet: { pref: "none", notes: "" } }; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function rawLocal() { try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
  function getArr(k) { var v = loadJson(k); return Array.isArray(v) ? v : []; }

  function localLoadMe() {
    var s = rawLocal(), m = blankMe();
    if (s) { ["visits", "done", "skip", "swap", "last", "chores", "timeLog", "doneLog", "name", "photo", "theme", "kitchenMode", "kitchenGroupId", "diet"].forEach(function (k) { if (s[k] !== undefined) m[k] = s[k]; }); }
    if (currentUser) { if (!m.name) m.name = currentUser.name; if (!m.photo) m.photo = currentUser.photo; }
    m.kitchenGroupId = m.kitchenGroupId || Math.random().toString(36).substring(2, 6).toUpperCase();
    return m;
  }
  function saveMe() { saveJson(KEY, me); syncCloudUser(); }

  function persistShared() {
    saveJson("one-small-thing-db-shared", shared);
    saveJson("one-small-thing-db-shopping", shopping);
    saveJson("one-small-thing-db-scores", scores);
    saveJson("one-small-thing-db-chat", chat);
    saveJson("one-small-thing-db-recipes", houseRecipes);
    saveJson("one-small-thing-db-chatread", chatReads);
  }
  function saveSharedDB() { persistShared(); syncCloudHome(); }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function monthKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function weekKey(d) { var off = (d.getDay() + 6) % 7; return dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - off)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(ms) { var t = Math.max(0, Math.floor(ms / 1000)); return pad(Math.floor(t / 60)) + ":" + pad(t % 60); }
  function myName() { return (scores && scores[uid] && scores[uid].name) || me.name || ""; }
  function displayName(id) { return (scores && scores[id] && scores[id].name) || (id === uid ? "You" : "Roommate"); }
  function nameOf(id) { return id === uid ? "You" : displayName(id); }
  function initials(n) { var w = String(n).trim().split(/\s+/); return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : (w[0] || "?").slice(0, 2)).toUpperCase(); }

  function applyTheme() {
    var t = me.theme || "auto";
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
  applyTheme();
  function flash(m) { flashMsg = m; render(); setTimeout(function () { flashMsg = ""; render(); }, 4000); }

  function fireConfettiAndCheer() {
    if (window.confetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    flash("🎉 Way to go!");
  }

  /* Cloud Sync to Firebase */
  function b64u(bytes) { var bin = ""; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function unb64u(t) { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; var bin = atob(t), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  async function rKey(k) { return crypto.subtle.importKey("raw", unb64u(k), "AES-GCM", false, ["encrypt", "decrypt"]); }
  async function rEnc(obj, k) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, await rKey(k), new TextEncoder().encode(JSON.stringify(obj)));
    return { v: 1, iv: b64u(iv), ct: b64u(new Uint8Array(ct)) };
  }
  async function rDec(pack, k) {
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64u(pack.iv) }, await rKey(k), unb64u(pack.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function rUrl(id) { return DEFAULT_DB + "/homes/" + encodeURIComponent(id) + ".json"; }

  async function syncCloudUser() {
    if (!currentUser) return;
    try {
      await fetch(DEFAULT_DB + "/users/" + currentUser.uid + ".json", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ profile: currentUser, relay: relay, me: me })
      });
    } catch (e) {}
  }

  async function syncCloudHome() {
    if (!relay) return;
    try {
      var data = { shared: shared, shopping: shopping, chat: chat, chatReads: chatReads, houseRecipes: houseRecipes, scores: scores };
      var pack = await rEnc(data, relay.key);
      await fetch(rUrl(relay.id), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pack) });
    } catch (e) {}
  }

  async function loadCloudHome(id, key) {
    var res = await fetch(rUrl(id));
    var pack = await res.json();
    if (!pack || !pack.ct) throw new Error("Home not found.");
    var data = await rDec(pack, key);
    shared = data.shared || []; shopping = data.shopping || []; chat = data.chat || [];
    chatReads = data.chatReads || {}; houseRecipes = data.houseRecipes || []; scores = data.scores || {};
    persistShared();
    relay = { id: id, key: key };
    saveJson("one-small-thing-relay", relay);
    syncCloudUser();
  }

  async function handleGoogleSignIn(email, name, photo) {
    var uidGen = "g_" + email.toLowerCase().replace(/[^a-z0-9]/g, "");
    currentUser = { uid: uidGen, email: email, name: name || email.split("@")[0], photo: photo || "" };
    saveJson(AUTH_KEY, currentUser);
    uid = uidGen;
    localStorage.setItem("one-small-thing-uid", uid);
    if (!me.name) me.name = currentUser.name;
    if (!me.photo && currentUser.photo) me.photo = currentUser.photo;
    saveMe();

    try {
      var res = await fetch(DEFAULT_DB + "/users/" + uidGen + ".json");
      var userRec = await res.json();
      if (userRec) {
        if (userRec.me) { me = userRec.me; saveJson(KEY, me); }
        if (userRec.relay) {
          relay = userRec.relay;
          saveJson("one-small-thing-relay", relay);
          await loadCloudHome(relay.id, relay.key);
        }
      }
    } catch (e) {}
    render();
  }

  function render() {
    var app = document.getElementById("app");
    var header = document.getElementById("mainHeader");

    /* PAGE 1: Sign In */
    if (!currentUser) {
      header.style.display = "none";
      app.innerHTML = '<div class="landing">' +
        '<h1>Just One</h1>' +
        '<p class="tagline">Clean Home &middot; Clear Mind</p>' +
        '<div class="landing-box">' +
          '<p class="small">Sign in with Google to sync your home and tasks across all your devices.</p>' +
          '<button class="btn primary large" data-act="google-signin">Sign in with Google</button>' +
        '</div>' +
      '</div>';
      return;
    }

    var inHouse = !!(scores && scores[uid] && scores._meta);

    /* PAGE 2: Create or Join Home */
    if (!inHouse) {
      header.style.display = "none";
      app.innerHTML = '<div class="landing">' +
        '<h1>Just One</h1>' +
        '<p class="tagline">Welcome, ' + esc(currentUser.name) + '</p>' +
        '<div class="landing-box">' +
          '<button class="btn primary large" data-act="create-home">Create a New Home</button>' +
          '<div style="display:flex; align-items:center; gap:0.5rem; color:var(--muted);"><hr style="flex:1; border-top:1px solid var(--line); border-bottom:0;">OR<hr style="flex:1; border-top:1px solid var(--line); border-bottom:0;"></div>' +
          '<form id="joinHomeForm" style="display:flex; flex-direction:column; gap:0.5rem;">' +
            '<input id="joinCodeInput" type="text" placeholder="Enter 6-char invite code" style="text-align:center; padding:0.8rem; font-size:1.1rem; border:1px solid var(--line); border-radius:10px;" autocomplete="off" required>' +
            '<button class="btn large" type="submit">Join Home</button>' +
          '</form>' +
          '<button class="btn quiet small" data-act="sign-out">Sign Out</button>' +
        '</div>' +
      '</div>';
      return;
    }

    /* PAGE 3: The Main App */
    header.style.display = "block";
    var b = document.getElementById("profileBtn");
    if (b) {
      b.style.display = "flex";
      if (me.photo) { b.style.backgroundImage = "url(" + me.photo + ")"; b.textContent = ""; }
      else { b.style.backgroundImage = "none"; b.textContent = initials(myName()); }
    }

    var body = "";
    var today = dayKey(new Date());
    if (tab === "house") body = showChat ? chatView() : houseView();
    else if (tab === "board") body = boardView();
    else if (tab === "kitchen") body = kitchenView();
    else if (tab === "settings") body = settingsView();
    else body = '<section class="card" aria-labelledby="h-today"><h2 id="h-today">Today\'s small thing</h2><p class="big">Wipe down the counter by the stove</p><p class="note">Takes about two minutes. Worth 1 point.</p><div class="row"><button class="btn primary" data-act="done">I did it</button></div></section>';

    app.innerHTML = '<div class="shell">' +
      '<div class="tabs" role="group" aria-label="Sections">' +
        '<button class="tab" data-act="tab" data-tab="me" aria-pressed="' + (tab === "me") + '">Me</button>' +
        '<button class="tab" data-act="tab" data-tab="house" aria-pressed="' + (tab === "house") + '">House</button>' +
        '<button class="tab" data-act="tab" data-tab="kitchen" aria-pressed="' + (tab === "kitchen") + '">Kitchen</button>' +
        '<button class="tab" data-act="tab" data-tab="board" aria-pressed="' + (tab === "board") + '">Board</button>' +
        '<button class="tab" data-act="tab" data-tab="settings" aria-pressed="' + (tab === "settings") + '">⚙️</button>' +
      '</div>' +
      '<div class="main">' + (flashMsg ? '<p class="banner">' + esc(flashMsg) + '</p>' : "") + body + '</div>' +
    '</div>';
  }

  function houseView() { return '<section class="card"><h2>House Jobs</h2><p class="small">Shared with roommates.</p></section>'; }
  function boardView() { return '<section class="card"><h2>Leaderboard</h2><p class="small">Invite Code: <strong>' + esc(scores._meta.inviteCode) + '</strong></p></section>'; }
  function kitchenView() { return '<section class="card"><h2>Kitchen & Recipes</h2></section>'; }
  function settingsView() { return '<section class="card"><h2>Settings</h2><button class="btn" data-act="sign-out">Sign Out</button></section>'; }
  function chatView() { return '<section class="card"><h2>Chat</h2><button class="btn quiet small" data-act="close-chat">Back</button></section>'; }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");

    if (act === "google-signin") {
      var email = prompt("Enter your Google email:") || "user@gmail.com";
      var name = prompt("Enter your name:") || email.split("@")[0];
      handleGoogleSignIn(email, name, "");
      return;
    }
    if (act === "sign-out") {
      localStorage.removeItem(AUTH_KEY);
      currentUser = null;
      render();
      return;
    }
    if (act === "create-home") {
      (async function() {
        var inviteCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        var key = b64u(crypto.getRandomValues(new Uint8Array(16)));
        var homeId = "h_" + Math.random().toString(36).substring(2, 8);
        scores = { _meta: { inviteCode: inviteCode } };
        scores[uid] = { joined: Date.now(), entries: {}, name: currentUser.name };
        shared = []; shopping = []; chat = []; houseRecipes = [];
        persistShared();
        relay = { id: homeId, key: key };
        saveJson("one-small-thing-relay", relay);
        await syncCloudHome();
        await syncCloudUser();
        flash("Home created!");
        render();
      })();
      return;
    }
    if (act === "tab") { tab = el.getAttribute("data-tab"); render(); return; }
    if (act === "done") { fireConfettiAndCheer(); render(); return; }
  });

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "joinHomeForm") {
      flash("Joining home...");
      setTimeout(function() { flash("Joined successfully!"); render(); }, 800);
    }
  });

  render();
})();
</script>
</body>
</html>
